<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210" role="img" aria-label="Terminal: yousseftarek, Backend Developer and Linux Enthusiast">
  <title>yousseftarek@github</title>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", DejaVu Sans Mono, monospace; font-size: 15px; }
    .prompt { fill: #2D7DE4; }
    .cmd    { fill: #7CEBF5; }
    .out    { fill: #C9D1D9; }
    .dim    { fill: #8B949E; font-size: 13px; }

    /* Everything is visible by default. The animations only replay the
       reveal, so the banner still reads correctly if they never run. */
    @keyframes type  { from { clip-path: inset(0 100% 0 0); } }
    @keyframes fade  { from { opacity: 0; } }
    @keyframes blink { 0%, 50% { opacity: 0; } 50.01%, 100% { opacity: 1; } }

    .l1 { animation: type 0.7s steps(8)  0.2s backwards; }
    .l2 { animation: fade 0.25s          1.0s backwards; }
    .l3 { animation: type 1.0s steps(15) 1.5s backwards; }
    .l4 { animation: type 1.2s steps(38) 2.8s backwards; }
    .l5 { animation: fade 0.2s           4.2s backwards; }
    .cur { animation: blink 1.1s steps(1) 4.4s infinite backwards; }

    @media (prefers-reduced-motion: reduce) {
      .l1, .l2, .l3, .l4, .l5, .cur { animation: none; }
    }
  </style>

  <!-- window -->
  <rect x="0.75" y="0.75" width="758.5" height="208.5" rx="10" fill="#1F222E" stroke="#7CEBF5" stroke-width="1.5"/>
  <path d="M0.75 36 H759.25" stroke="#7CEBF5" stroke-width="1" opacity="0.35"/>

  <!-- title bar -->
  <circle cx="22" cy="18" r="5.5" fill="#FF5F57"/>
  <circle cx="41" cy="18" r="5.5" fill="#FEBC2E"/>
  <circle cx="60" cy="18" r="5.5" fill="#28C840"/>
  <text class="mono dim" x="380" y="23" text-anchor="middle">yousseftarek@github: ~</text>

  <!-- session -->
  <text class="mono l1" x="26" y="66"><tspan class="prompt">$ </tspan><tspan class="cmd">whoami</tspan></text>
  <text class="mono out l2" x="26" y="92">yousseftarek</text>

  <text class="mono l3" x="26" y="124"><tspan class="prompt">$ </tspan><tspan class="cmd">cat about.txt</tspan></text>
  <text class="mono out l4" x="26" y="150">Backend Developer and Linux Enthusiast</text>

  <text class="mono prompt l5" x="26" y="182">$</text>
  <rect class="cur" x="44" y="170" width="9" height="16" fill="#7CEBF5"/>
</svg>
